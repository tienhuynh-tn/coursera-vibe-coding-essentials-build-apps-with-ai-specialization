<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="calculator" aria-label="Calculator app">
      <div class="topbar">
        <h1>Calculator</h1>
        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="Switch to dark mode"
          title="Switch theme"
        >
          <span class="icon-sun" aria-hidden="true">☀</span>
          <span class="icon-moon" aria-hidden="true">🌙</span>
        </button>
      </div>

      <div class="display" id="display" aria-live="polite">0</div>

      <div class="keys" role="group" aria-label="Calculator buttons">
        <button data-action="clear" class="action">C</button>
        <button data-action="delete" class="action">DEL</button>
        <button data-value="/" class="operator">÷</button>
        <button data-value="*" class="operator">×</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button data-value="-" class="operator">−</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button data-value="+" class="operator">+</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button data-action="equals" class="equals">=</button>

        <button data-value="0" class="zero">0</button>
        <button data-value=".">.</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
